# ofxManifold kernel CI.
#
# This file is HAND-WRITTEN TEXT and must stay that way.
#
# YAML 1.1 reads the bare word `on` as the boolean true. GitHub parses with
# YAML 1.2, where it stays a string, so the trigger below is correct -- but
# loading this file with PyYAML and dumping it back rewrites the key as
# `true:` and GitHub rejects the entire workflow. It also collapses every
# run block into an escaped one-line string that cannot be read or diffed.
# See DECISIONS.md D-008.
#
# Mutation gates call tests/mutate.py rather than sed. Mutation patterns are
# C++ fragments full of characters sed treats as syntax: || collides with the
# s|...|...| delimiter, [ ] are bracket expressions, & in a replacement means
# the whole match. Two failures here came from that escaping rather than from
# the code under test. mutate.py exits 2 when an anchor is missing or
# ambiguous; a sed that fails to match exits 0 and changes nothing, which
# makes a gate that never ran look exactly like a gate that passed.

name: kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # both results always; neither masks the other
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          c++ --version
          python3 --version
          uname -sm

      # Recorded because D-001 was a floating-point difference between
      # platforms. If a future failure has that shape, the evidence is
      # already in the log rather than needing a reproduction.
      - name: Floating-point characteristics
        run: |
          cat > /tmp/fp.cpp <<'EOF'
          #include <cstdio>
          #include <cfloat>
          #include <cmath>
          int main() {
              printf("FLT_EPSILON = %.6e\n", (double)FLT_EPSILON);
              float ux=0.1f, uy=0.1f, vx=0.4f, vy=0.4f, wx=0.7f, wy=0.7f;
              float area2 = (vx-ux)*(wy-uy) - (wx-ux)*(vy-uy);
              printf("collinear area2 = %.12e\n", (double)area2);
              printf("FMA contraction = %s\n", area2 == 0.0f ? "no" : "YES");
              printf("vs kAreaEpsilon 1e-6 : %s\n",
                     std::fabs(area2) < 1e-6f ? "rejected (correct)"
                                              : "ACCEPTED (bug)");
              return 0;
          }
          EOF
          c++ -std=c++17 -O2 -o /tmp/fp /tmp/fp.cpp && /tmp/fp

      # Without this, a reference could be edited without regenerating and the
      # suite would keep passing against stale expected values.
      - name: Vectors are reproducible from the references
        run: |
          for v in triangle manifold interpretation mapping serialize trajectory; do
            cp tests/vectors/$v.vec /tmp/committed_$v.vec
          done
          make vectors
          for v in triangle manifold interpretation mapping serialize trajectory; do
            if ! diff -u /tmp/committed_$v.vec tests/vectors/$v.vec; then
              echo "::error::$v.vec does not match a fresh run of its reference"
              exit 1
            fi
          done
          echo "all vector files reproduce byte-for-byte"

      - name: Headers are self-contained
        run: make headers

      # Syntax only. The stub has already been wrong once -- it declared an
      # ofBuffer constructor oF 0.12.1 does not have, which passed here and
      # failed on a real machine. Green means no typos, not "this builds".
      - name: Wrapper and examples syntax-check
        run: make wrapper

      - name: Conformance
        run: make test

  # A green suite that cannot go red is an assertion, not a check.
  mutation:
    name: suite-can-fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Baseline must be green
        run: make test

      - name: Transposed sub-area argument must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifoldTriangle.h \
            'const float sB = signedArea2(p, c, a);' \
            'const float sB = signedArea2(p, a, c);'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifoldTriangle.h

      - name: Unrenormalized bias must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifoldTriangle.h \
            'r.w[i] = scaled[i] * inv;' \
            'r.w[i] = scaled[i];'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifoldTriangle.h

      - name: Epsilon below the float noise floor must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifoldTypes.h \
            'kAreaEpsilon = 1e-6f' \
            'kAreaEpsilon = 1e-9f'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifoldTypes.h

      - name: Epsilon large enough to eat valid topology must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifoldTypes.h \
            'kAreaEpsilon = 1e-6f' \
            'kAreaEpsilon = 1e-3f'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifoldTypes.h

      - name: T-junction detection disabled must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifold2D.h \
            'rep.tJunctions.push_back(TJunction{n, r, ia, ib});' \
            '(void)0;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: Orphan detection disabled must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifold2D.h \
            'if (!used[n]) rep.orphans.push_back(n);' \
            '(void)used;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: Node identity rotated in the result must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifold2D.h \
            'e.weights.push_back(WeightedNode{ids[i], br.w[i]});' \
            'e.weights.push_back(WeightedNode{ids[(i+1)%3], br.w[i]});'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: positionOf skips the un-bias must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifold2D.h \
            'out.position += (raw[i] / rawTotal) * nodes_[w[i].id].position;' \
            'out.position += w[i].weight * nodes_[w[i].id].position;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: sharesRegion check dropped must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifold2D.h \
            '&& sharesRegion(w);' \
            '&& true;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: setNodePosition ignores sign flip must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifold2D.h \
            '|| sign != regions_[r].constructionSign()' \
            '|| false'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: Evaluator ignores its hint must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifoldEvaluator.h \
            'manifold_->evaluate(p, lastRegion_)' \
            'manifold_->evaluate(p, InvalidRegion)'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifoldEvaluator.h

      - name: Evaluator keeps a stale hint must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifoldEvaluator.h \
            'lastRegion_ = e.inside ? e.regionID : InvalidRegion;' \
            'if (e.inside) lastRegion_ = e.regionID;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifoldEvaluator.h

      - name: Curve renormalizes must be caught
        run: |
          python3 tests/mutate.py --nl src/interpretation/ofxManifoldCurves.h \
            '    }\n    return out;\n}\n\n} // namespace curve' \
            '    }\n    return normalize(out);\n}\n\n} // namespace curve'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldCurves.h

      - name: Curve loses node identity must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldCurves.h \
            'out.push_back(WeightedNode{wn.id, fn(wn.weight)});' \
            'out.push_back(WeightedNode{static_cast<NodeID>(out.size()), fn(wn.weight)});'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldCurves.h

      - name: Wrong equal-power curve must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldCurves.h \
            'return (w <= 0.0f) ? 0.0f : std::sqrt(w);' \
            'return w * 0.5f;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldCurves.h

      - name: Wrong cosine quadrant must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldCurves.h \
            'return std::sin(w * 1.57079632679489661923f);' \
            'return std::cos(w * 1.57079632679489661923f);'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldCurves.h

      - name: Spread ignores its amount must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldSpread.h \
            'out[wn.id].weight += (1.0f - amount) * wn.weight;' \
            'out[wn.id].weight += wn.weight;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldSpread.h

      - name: Spread does not clamp must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldSpread.h \
            'if (amount > 1.0f) amount = 1.0f;' \
            '// mutant: no clamp'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldSpread.h

      - name: Blend gains not curved must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldBlend.h \
            'const float ga = fn(1.0f - t);' \
            'const float ga = 1.0f - t;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldBlend.h

      - name: Blend overwrites shared nodes must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldBlend.h \
            'it->weight += wn.weight * gb;' \
            'it->weight = wn.weight * gb;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldBlend.h

      - name: Mapping links not normalized within the node must be caught
        run: |
          python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \
            'acc[l.id] += wn.weight * (l.weight / linkTotal);' \
            'acc[l.id] += wn.weight * l.weight;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/mapping/ofxManifoldMapping.h

      - name: Duplicate bind replaces instead of accumulating must be caught
        run: |
          python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \
            'if (l.id == target) { l.weight += weight; return; }' \
            'if (l.id == target) { l.weight = weight; return; }'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/mapping/ofxManifoldMapping.h

      - name: Dense arity follows contributions not targets must be caught
        run: |
          python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \
            'std::vector<float> dense(targetNames_.size(), 0.0f);' \
            'std::vector<float> dense(resolve(w).targets.size(), 0.0f);'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/mapping/ofxManifoldMapping.h

      - name: Power aggregator skips the root must be caught
        run: |
          python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \
            'v = (v <= 0.0f) ? 0.0f : std::sqrt(v);' \
            'v = v;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/mapping/ofxManifoldMapping.h

      - name: Null node redistributes instead of discarding must be caught
        run: |
          python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \
            '                continue;                   // null node: weight discarded' \
            '                for (auto& a : acc) a += wn.weight / acc.size(); continue;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/mapping/ofxManifoldMapping.h

      - name: JSON exponents not parsed must be caught
        run: |
          python3 tests/mutate.py src/io/ofxManifoldJSON.h \
            'if (i < s.size() && (s[i] == '\''e'\'' || s[i] == '\''E'\'')) {' \
            'if (false) {'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldJSON.h

      - name: JSON duplicate keys last-wins must be caught
        run: |
          python3 tests/mutate.py src/io/ofxManifoldJSON.h \
            'if (o.find(key) != o.end()) return fail("duplicate key: " + key);' \
            '(void)0;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldJSON.h

      - name: JSON write precision below float round-trip must be caught
        run: |
          python3 tests/mutate.py src/io/ofxManifoldJSON.h \
            '"%.9g"' \
            '"%.7g"'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldJSON.h

      - name: Loader accepts an unknown space must be caught
        run: |
          python3 tests/mutate.py --nl src/io/ofxManifoldSerialize.h \
            'res.error = "unsupported space: " + root["space"].asString();\n        return res;\n    }\n    if (!root.has("nodes")' \
            'res.error = "unsupported space";\n    }\n    if (!root.has("nodes")'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldSerialize.h

      - name: Loader accepts a dangling triangle reference must be caught
        run: |
          python3 tests/mutate.py --nl src/io/ofxManifoldSerialize.h \
            'res.error = "triangle references unknown node: " + nm;\n                    return res;' \
            'continue;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldSerialize.h

      - name: Mapping written by NodeID instead of name must be caught
        run: |
          python3 tests/mutate.py src/io/ofxManifoldSerialize.h \
            'json::quote(m.node(id).name)' \
            'json::quote(std::to_string(id))'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldSerialize.h

      - name: Mapping target written by id instead of name must be caught
        run: |
          python3 tests/mutate.py src/io/ofxManifoldSerialize.h \
            '<< ", \"target\": " << json::quote(mp.targetName(l.id))' \
            '<< ", \"target\": " << json::quote(std::to_string(l.id))'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldSerialize.h

      - name: Interpolate ignores node identity must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldInterpolate.h \
            'acc = acc + values[wn.id] * wn.weight;' \
            'acc = acc + values[&wn - &w[0]] * wn.weight;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldInterpolate.h

      - name: Interpolate drops the weight must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldInterpolate.h \
            'acc = acc + values[wn.id] * wn.weight;' \
            'acc = acc + values[wn.id];'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldInterpolate.h

      - name: Coverage counts out-of-range nodes must be caught
        run: |
          python3 tests/mutate.py src/interpretation/ofxManifoldInterpolate.h \
            '        if (wn.id < valueCount) total += wn.weight;' \
            '        total += wn.weight;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/interpretation/ofxManifoldInterpolate.h

      - name: Solve using unsigned areas must be caught
        run: |
          python3 tests/mutate.py src/core/ofxManifoldTriangle.h \
            '    const float sA = signedArea2(p, b, c);' \
            '    const float sA = std::fabs(signedArea2(p, b, c));'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifoldTriangle.h

      - name: Finalize must preserve sample spacing must be caught
        run: |
          python3 tests/mutate.py src/sources/ofxManifoldTrajectory.h \
            '            for (auto& s : samples_) s.t = (s.t - t0) / span;' \
            '            for (std::size_t i = 0; i < samples_.size(); ++i) samples_[i].t = float(i)/float(samples_.size()-1);'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/sources/ofxManifoldTrajectory.h

      - name: Finalize must start the path at zero must be caught
        run: |
          python3 tests/mutate.py src/sources/ofxManifoldTrajectory.h \
            '        const float t0 = samples_.front().t;' \
            '        const float t0 = 0.0f;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/sources/ofxManifoldTrajectory.h

      - name: addSample must clamp backwards time must be caught
        run: |
          python3 tests/mutate.py src/sources/ofxManifoldTrajectory.h \
            '            t = samples_.back().t;      // never allow time to run backwards' \
            '            (void)0;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/sources/ofxManifoldTrajectory.h

      - name: pointAt must interpolate, not snap must be caught
        run: |
          python3 tests/mutate.py src/sources/ofxManifoldTrajectory.h \
            '        return a.position + (b.position - a.position) * u;' \
            '        return (u < 0.5f) ? a.position : b.position;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/sources/ofxManifoldTrajectory.h

      - name: pointAt must clamp outside the path must be caught
        run: |
          python3 tests/mutate.py src/sources/ofxManifoldTrajectory.h \
            '        if (t <= samples_.front().t) return samples_.front().position;' \
            '        if (t < -1e9f) return samples_.front().position;'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/sources/ofxManifoldTrajectory.h

      - name: Trajectory loader must refuse backwards time must be caught
        run: |
          python3 tests/mutate.py src/io/ofxManifoldSerialize.h \
            '            res.error = "samples are not in non-decreasing time order";' \
            '            res.error = "";'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldSerialize.h

      - name: Trajectory loader accepts an unknown space must be caught
        run: |
          python3 tests/mutate.py --nl src/io/ofxManifoldSerialize.h \
            'res.error = "unsupported space: " + root["space"].asString();\n        return res;\n    }\n    if (!root.has("samples")' \
            'res.error = "unsupported space";\n    }\n    if (!root.has("samples")'
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/io/ofxManifoldSerialize.h

      - name: Restored tree must be green
        run: |
          make clean
          make test
