name: kernel

# The kernel has no openFrameworks dependency, so CI needs nothing but a
# compiler, python3, and make. That is the point of the core/wrapper split.
#
# Both platforms are load-bearing, not ceremonial. See DECISIONS.md D-001:
# identical source produced 19/19 green on x86 Linux and 17/19 red on Apple
# Silicon, because clang contracted a*b - c*d into a single FMA and left a
# 4.17e-09 residual where x86 returned exact zero. The Linux green was wrong.
# A single-platform matrix would have shipped that bug.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # both results always, never one masking the other
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          echo "--- compiler ---"
          c++ --version
          echo "--- python ---"
          python3 --version
          echo "--- arch ---"
          uname -sm

      # Floating-point behaviour is the thing under test, so record what the
      # platform actually does rather than assuming. If a future failure looks
      # like D-001, this block is where the evidence will already be.
      - name: Floating-point characteristics
        run: |
          cat > /tmp/fp.cpp <<'EOF'
          #include <cstdio>
          #include <cfloat>
          #include <cmath>
          int main() {
              printf("FLT_EPSILON = %.6e\n", (double)FLT_EPSILON);
              // Exactly collinear. Zero in exact arithmetic; nonzero if the
              // compiler contracts the expression into an FMA.
              float ux=0.1f, uy=0.1f, vx=0.4f, vy=0.4f, wx=0.7f, wy=0.7f;
              float area2 = (vx-ux)*(wy-uy) - (wx-ux)*(vy-uy);
              printf("collinear area2 = %.12e\n", (double)area2);
              printf("FMA contraction = %s\n", area2 == 0.0f ? "no" : "YES");
              printf("vs kAreaEpsilon 1e-6 : %s\n",
                     std::fabs(area2) < 1e-6f ? "rejected (correct)"
                                              : "ACCEPTED (bug)");
              return 0;
          }
          EOF
          c++ -std=c++17 -O2 -o /tmp/fp /tmp/fp.cpp && /tmp/fp

      # The reference must reproduce its own committed output. Without this,
      # reference.py could be edited without regenerating, and the suite would
      # keep passing against stale expected values -- which is the same failure
      # as a reference that agrees with the implementation by construction.
      - name: Vectors are reproducible from the reference
        run: |
          cp tests/vectors/triangle.vec /tmp/committed_tri.vec
          cp tests/vectors/manifold.vec /tmp/committed_man.vec
          make vectors
          if ! diff -u /tmp/committed_man.vec tests/vectors/manifold.vec; then
              echo "::error::manifold.vec does not match a fresh run of reference_manifold.py"
              exit 1
          fi
          if ! diff -u /tmp/committed_tri.vec tests/vectors/triangle.vec; then
              echo ""
              echo "::error::tests/vectors/triangle.vec does not match a fresh"
              echo "run of tests/ref/reference.py. Run 'make vectors' and commit"
              echo "the result in the same commit as the reference change."
              exit 1
          fi
          echo "vectors reproduce byte-for-byte"

      - name: Conformance
        run: make test

  # A green suite that cannot go red is an assertion, not a check. This job
  # introduces known faults and requires each to be caught. It runs on Linux
  # only -- it is testing the suite, not the platform.
  mutation:
    name: suite-can-fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baseline must be green
        run: make test

      - name: Transposed sub-area argument must be caught
        run: |
          sed -i 's|signedArea2(p, c, a)|signedArea2(p, a, c)|' \
              src/core/ofxManifoldTriangle.h
          make clean
          if make test; then
              echo "::error::suite passed with a transposed sub-area argument"
              exit 1
          fi
          git checkout -- src/core/ofxManifoldTriangle.h

      - name: Unrenormalized bias must be caught
        run: |
          sed -i 's|r.w\[i\] = scaled\[i\] \* inv;|r.w[i] = scaled[i];|' \
              src/core/ofxManifoldTriangle.h
          make clean
          if make test; then
              echo "::error::suite passed with bias left unnormalized"
              exit 1
          fi
          git checkout -- src/core/ofxManifoldTriangle.h

      # Both directions. An epsilon too small accepts degenerate triangles;
      # too large eats legitimate fine-mesh topology. A one-sided suite would
      # catch only the first.
      - name: Epsilon too small must be caught
        run: |
          sed -i 's|kAreaEpsilon = 1e-6f|kAreaEpsilon = 1e-9f|' \
              src/core/ofxManifoldTypes.h
          make clean
          if make test; then
              echo "::error::suite passed with kAreaEpsilon below the float noise floor"
              exit 1
          fi
          git checkout -- src/core/ofxManifoldTypes.h

      - name: Epsilon too large must be caught
        run: |
          sed -i 's|kAreaEpsilon = 1e-6f|kAreaEpsilon = 1e-3f|' \
              src/core/ofxManifoldTypes.h
          make clean
          if make test; then
              echo "::error::suite passed with an epsilon that rejects valid topology"
              exit 1
          fi
          git checkout -- src/core/ofxManifoldTypes.h

      - name: T-junction detection must be caught if disabled
        run: |
          sed -i 's|rep.tJunctions.push_back(TJunction{n, r, ia, ib});|(void)0;|' src/core/ofxManifold2D.h
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: Orphan detection must be caught if disabled
        run: |
          sed -i 's|if (!used\[n\]) rep.orphans.push_back(n);|(void)used;|' src/core/ofxManifold2D.h
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: Swapped node identity must be caught
        run: |
          sed -i 's|e.weights.push_back(WeightedNode{ids\[i\], br.w\[i\]});|e.weights.push_back(WeightedNode{ids[(i+1)%3], br.w[i]});|' src/core/ofxManifold2D.h
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: Clamping outside the hull must be caught
        run: |
          python3 - <<'PYEOF'
          p='src/core/ofxManifold2D.h'
          s=open(p).read()
          old="        return e;                              // inside == false, empty"
          s=s.replace(old,"        if (!regions_.empty()) { fill(e, 0, p); }\n        return e;")
          open(p,'w').write(s)
          PYEOF
          make clean
          if make test; then echo "::error::not caught"; exit 1; fi
          git checkout -- src/core/ofxManifold2D.h

      - name: Restored tree must be green
        run: |
          make clean
          make test
