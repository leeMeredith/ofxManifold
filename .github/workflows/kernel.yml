# ofxManifold kernel CI.
#
# Mutation gates call tests/mutate.py, not sed. Mutation patterns are C++
# fragments full of characters sed treats as syntax -- || collides with the
# s|...|...| delimiter, [ ] are bracket expressions, & in a replacement means
# the whole match. Two failures in this project came from that escaping
# rather than from the code under test.
#
# mutate.py exits 2 when an anchor is not found, and refuses an anchor that
# appears more than once. A sed that fails to match exits 0 and changes
# nothing, which makes a gate that never ran look exactly like a gate that
# passed.

name: kernel
true:
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          name: linux-x86_64
        - os: macos-latest
          name: macos-arm64
    steps:
    - uses: actions/checkout@v5
    - name: Toolchain
      run: 'echo "--- compiler ---"

        c++ --version

        echo "--- python ---"

        python3 --version

        echo "--- arch ---"

        uname -sm

        '
    - name: Floating-point characteristics
      run: "cat > /tmp/fp.cpp <<'EOF'\n#include <cstdio>\n#include <cfloat>\n#include <cmath>\nint main() {\n    printf(\"\
        FLT_EPSILON = %.6e\\n\", (double)FLT_EPSILON);\n    // Exactly collinear. Zero in exact arithmetic; nonzero if the\n\
        \    // compiler contracts the expression into an FMA.\n    float ux=0.1f, uy=0.1f, vx=0.4f, vy=0.4f, wx=0.7f, wy=0.7f;\n\
        \    float area2 = (vx-ux)*(wy-uy) - (wx-ux)*(vy-uy);\n    printf(\"collinear area2 = %.12e\\n\", (double)area2);\n\
        \    printf(\"FMA contraction = %s\\n\", area2 == 0.0f ? \"no\" : \"YES\");\n    printf(\"vs kAreaEpsilon 1e-6 : %s\\\
        n\",\n           std::fabs(area2) < 1e-6f ? \"rejected (correct)\"\n                                    : \"ACCEPTED\
        \ (bug)\");\n    return 0;\n}\nEOF\nc++ -std=c++17 -O2 -o /tmp/fp /tmp/fp.cpp && /tmp/fp\n"
    - name: Vectors are reproducible from the reference
      run: "cp tests/vectors/triangle.vec /tmp/committed_tri.vec\ncp tests/vectors/manifold.vec /tmp/committed_man.vec\ncp\
        \ tests/vectors/interpretation.vec /tmp/committed_int.vec\ncp tests/vectors/mapping.vec /tmp/committed_map.vec\ncp\
        \ tests/vectors/serialize.vec /tmp/committed_ser.vec\nmake vectors\nif ! diff -u /tmp/committed_ser.vec tests/vectors/serialize.vec;\
        \ then\n    echo \"::error::serialize.vec does not match a fresh run of its reference\"\n    exit 1\nfi\nif ! diff\
        \ -u /tmp/committed_map.vec tests/vectors/mapping.vec; then\n    echo \"::error::mapping.vec does not match a fresh\
        \ run of its reference\"\n    exit 1\nfi\nif ! diff -u /tmp/committed_int.vec tests/vectors/interpretation.vec; then\n\
        \    echo \"::error::interpretation.vec does not match a fresh run of its reference\"\n    exit 1\nfi\nif ! diff -u\
        \ /tmp/committed_man.vec tests/vectors/manifold.vec; then\n    echo \"::error::manifold.vec does not match a fresh\
        \ run of reference_manifold.py\"\n    exit 1\nfi\nif ! diff -u /tmp/committed_tri.vec tests/vectors/triangle.vec;\
        \ then\n    echo \"\"\n    echo \"::error::tests/vectors/triangle.vec does not match a fresh\"\n    echo \"run of\
        \ tests/ref/reference.py. Run 'make vectors' and commit\"\n    echo \"the result in the same commit as the reference\
        \ change.\"\n    exit 1\nfi\necho \"vectors reproduce byte-for-byte\"\n"
    - name: Headers are self-contained
      run: make headers
    - name: Conformance
      run: make test
  mutation:
    name: suite-can-fail
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Baseline must be green
      run: make test
    - name: Transposed sub-area argument must be caught
      run: "python3 tests/mutate.py src/core/ofxManifoldTriangle.h \\\n  \"const float sB = signedArea2(p, c, a);\" \\\n \
        \ \"const float sB = signedArea2(p, a, c);\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1;\
        \ fi\ngit checkout -- src/core/ofxManifoldTriangle.h\n"
    - name: Unrenormalized bias must be caught
      run: "python3 tests/mutate.py src/core/ofxManifoldTriangle.h \\\n  \"r.w[i] = scaled[i] * inv;\" \\\n  \"r.w[i] = scaled[i];\"\
        \nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifoldTriangle.h\n"
    - name: Epsilon below the float noise floor must be caught
      run: "python3 tests/mutate.py src/core/ofxManifoldTypes.h \\\n  \"kAreaEpsilon = 1e-6f\" \\\n  \"kAreaEpsilon = 1e-9f\"\
        \nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifoldTypes.h\n"
    - name: Epsilon large enough to eat valid topology must be caught
      run: "python3 tests/mutate.py src/core/ofxManifoldTypes.h \\\n  \"kAreaEpsilon = 1e-6f\" \\\n  \"kAreaEpsilon = 1e-3f\"\
        \nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifoldTypes.h\n"
    - name: T-junction detection disabled must be caught
      run: "python3 tests/mutate.py src/core/ofxManifold2D.h \\\n  \"rep.tJunctions.push_back(TJunction{n, r, ia, ib});\"\
        \ \\\n  \"(void)0;\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifold2D.h\n"
    - name: Orphan detection disabled must be caught
      run: "python3 tests/mutate.py src/core/ofxManifold2D.h \\\n  \"if (!used[n]) rep.orphans.push_back(n);\" \\\n  \"(void)used;\"\
        \nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifold2D.h\n"
    - name: Node identity rotated in the result must be caught
      run: "python3 tests/mutate.py src/core/ofxManifold2D.h \\\n  \"e.weights.push_back(WeightedNode{ids[i], br.w[i]});\"\
        \ \\\n  \"e.weights.push_back(WeightedNode{ids[(i+1)%3], br.w[i]});\"\nmake clean\nif make test; then echo \"::error::not\
        \ caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifold2D.h\n"
    - name: positionOf skips the un-bias must be caught
      run: "python3 tests/mutate.py src/core/ofxManifold2D.h \\\n  \"out.position += (raw[i] / rawTotal) * nodes_[w[i].id].position;\"\
        \ \\\n  \"out.position += w[i].weight * nodes_[w[i].id].position;\"\nmake clean\nif make test; then echo \"::error::not\
        \ caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifold2D.h\n"
    - name: sharesRegion check dropped must be caught
      run: "python3 tests/mutate.py src/core/ofxManifold2D.h \\\n  \"&& sharesRegion(w);\" \\\n  \"&& true;\"\nmake clean\n\
        if make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifold2D.h\n"
    - name: setNodePosition ignores sign flip must be caught
      run: "python3 tests/mutate.py src/core/ofxManifold2D.h \\\n  \"|| sign != regions_[r].constructionSign()\" \\\n  \"\
        || false\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/core/ofxManifold2D.h\n"
    - name: Evaluator ignores its hint must be caught
      run: "python3 tests/mutate.py src/core/ofxManifoldEvaluator.h \\\n  \"manifold_->evaluate(p, lastRegion_)\" \\\n  \"\
        manifold_->evaluate(p, InvalidRegion)\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\n\
        git checkout -- src/core/ofxManifoldEvaluator.h\n"
    - name: Evaluator keeps a stale hint must be caught
      run: "python3 tests/mutate.py src/core/ofxManifoldEvaluator.h \\\n  \"lastRegion_ = e.inside ? e.regionID : InvalidRegion;\"\
        \ \\\n  \"if (e.inside) lastRegion_ = e.regionID;\"\nmake clean\nif make test; then echo \"::error::not caught\";\
        \ exit 1; fi\ngit checkout -- src/core/ofxManifoldEvaluator.h\n"
    - name: Curve renormalizes must be caught
      run: "python3 tests/mutate.py --nl src/interpretation/ofxManifoldCurves.h \\\n  \"    }\\n    return out;\\n}\\n\\n}\
        \ // namespace curve\" \\\n  \"    }\\n    return normalize(out);\\n}\\n\\n} // namespace curve\"\nmake clean\nif\
        \ make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/interpretation/ofxManifoldCurves.h\n"
    - name: Curve loses node identity must be caught
      run: "python3 tests/mutate.py src/interpretation/ofxManifoldCurves.h \\\n  \"out.push_back(WeightedNode{wn.id, fn(wn.weight)});\"\
        \ \\\n  \"out.push_back(WeightedNode{static_cast<NodeID>(out.size()), fn(wn.weight)});\"\nmake clean\nif make test;\
        \ then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/interpretation/ofxManifoldCurves.h\n"
    - name: Wrong equal-power curve must be caught
      run: "python3 tests/mutate.py src/interpretation/ofxManifoldCurves.h \\\n  \"return (w <= 0.0f) ? 0.0f : std::sqrt(w);\"\
        \ \\\n  \"return w * 0.5f;\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout\
        \ -- src/interpretation/ofxManifoldCurves.h\n"
    - name: Wrong cosine quadrant must be caught
      run: "python3 tests/mutate.py src/interpretation/ofxManifoldCurves.h \\\n  \"return std::sin(w * 1.57079632679489661923f);\"\
        \ \\\n  \"return std::cos(w * 1.57079632679489661923f);\"\nmake clean\nif make test; then echo \"::error::not caught\"\
        ; exit 1; fi\ngit checkout -- src/interpretation/ofxManifoldCurves.h\n"
    - name: Spread ignores its amount must be caught
      run: "python3 tests/mutate.py src/interpretation/ofxManifoldSpread.h \\\n  \"out[wn.id].weight += (1.0f - amount) *\
        \ wn.weight;\" \\\n  \"out[wn.id].weight += wn.weight;\"\nmake clean\nif make test; then echo \"::error::not caught\"\
        ; exit 1; fi\ngit checkout -- src/interpretation/ofxManifoldSpread.h\n"
    - name: Spread does not clamp must be caught
      run: "python3 tests/mutate.py src/interpretation/ofxManifoldSpread.h \\\n  \"if (amount > 1.0f) amount = 1.0f;\" \\\n\
        \  \"// mutant: no clamp\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout\
        \ -- src/interpretation/ofxManifoldSpread.h\n"
    - name: Blend gains not curved must be caught
      run: "python3 tests/mutate.py src/interpretation/ofxManifoldBlend.h \\\n  \"const float ga = fn(1.0f - t);\" \\\n  \"\
        const float ga = 1.0f - t;\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout\
        \ -- src/interpretation/ofxManifoldBlend.h\n"
    - name: Blend overwrites shared nodes must be caught
      run: "python3 tests/mutate.py src/interpretation/ofxManifoldBlend.h \\\n  \"it->weight += wn.weight * gb;\" \\\n  \"\
        it->weight = wn.weight * gb;\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout\
        \ -- src/interpretation/ofxManifoldBlend.h\n"
    - name: Mapping links not normalized within the node must be caught
      run: "python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \\\n  \"acc[l.id] += wn.weight * (l.weight / linkTotal);\"\
        \ \\\n  \"acc[l.id] += wn.weight * l.weight;\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit\
        \ 1; fi\ngit checkout -- src/mapping/ofxManifoldMapping.h\n"
    - name: Duplicate bind replaces instead of accumulating must be caught
      run: "python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \\\n  \"if (l.id == target) { l.weight += weight; return;\
        \ }\" \\\n  \"if (l.id == target) { l.weight = weight; return; }\"\nmake clean\nif make test; then echo \"::error::not\
        \ caught\"; exit 1; fi\ngit checkout -- src/mapping/ofxManifoldMapping.h\n"
    - name: Dense arity follows contributions not targets must be caught
      run: "python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \\\n  \"std::vector<float> dense(targetNames_.size(),\
        \ 0.0f);\" \\\n  \"std::vector<float> dense(resolve(w).targets.size(), 0.0f);\"\nmake clean\nif make test; then echo\
        \ \"::error::not caught\"; exit 1; fi\ngit checkout -- src/mapping/ofxManifoldMapping.h\n"
    - name: Power aggregator skips the root must be caught
      run: "python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \\\n  \"v = (v <= 0.0f) ? 0.0f : std::sqrt(v);\" \\\n\
        \  \"v = v;\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/mapping/ofxManifoldMapping.h\n"
    - name: Null node redistributes instead of discarding must be caught
      run: "python3 tests/mutate.py src/mapping/ofxManifoldMapping.h \\\n  \"                continue;                   //\
        \ null node: weight discarded\" \\\n  \"                for (auto& a : acc) a += wn.weight / acc.size(); continue;\"\
        \nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/mapping/ofxManifoldMapping.h\n"
    - name: JSON exponents not parsed must be caught
      run: "python3 tests/mutate.py src/io/ofxManifoldJSON.h \\\n  \"if (i < s.size() && (s[i] == 'e' || s[i] == 'E')) {\"\
        \ \\\n  \"if (false) {\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout --\
        \ src/io/ofxManifoldJSON.h\n"
    - name: JSON duplicate keys last-wins must be caught
      run: "python3 tests/mutate.py src/io/ofxManifoldJSON.h \\\n  \"if (o.find(key) != o.end()) return fail(\\\"duplicate\
        \ key: \\\" + key);\" \\\n  \"(void)0;\"\nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\n\
        git checkout -- src/io/ofxManifoldJSON.h\n"
    - name: JSON write precision below float round-trip must be caught
      run: "python3 tests/mutate.py src/io/ofxManifoldJSON.h \\\n  \"\\\"%.9g\\\"\" \\\n  \"\\\"%.7g\\\"\"\nmake clean\nif\
        \ make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/io/ofxManifoldJSON.h\n"
    - name: Loader accepts an unknown space must be caught
      run: "python3 tests/mutate.py --nl src/io/ofxManifoldSerialize.h \\\n  \"res.error = \\\"unsupported space: \\\" + root[\\\
        \"space\\\"].asString();\\n        return res;\" \\\n  \"res.error = \\\"unsupported space\\\";\"\nmake clean\nif\
        \ make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/io/ofxManifoldSerialize.h\n"
    - name: Loader accepts a dangling triangle reference must be caught
      run: "python3 tests/mutate.py --nl src/io/ofxManifoldSerialize.h \\\n  \"res.error = \\\"triangle references unknown\
        \ node: \\\" + nm;\\n                    return res;\" \\\n  \"continue;\"\nmake clean\nif make test; then echo \"\
        ::error::not caught\"; exit 1; fi\ngit checkout -- src/io/ofxManifoldSerialize.h\n"
    - name: Mapping written by NodeID instead of name must be caught
      run: "python3 tests/mutate.py src/io/ofxManifoldSerialize.h \\\n  \"json::quote(m.node(id).name)\" \\\n  \"json::quote(std::to_string(id))\"\
        \nmake clean\nif make test; then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/io/ofxManifoldSerialize.h\n"
    - name: Mapping target written by id instead of name must be caught
      run: "python3 tests/mutate.py src/io/ofxManifoldSerialize.h \\\n  \"<< \\\", \\\\\\\"target\\\\\\\": \\\" << json::quote(mp.targetName(l.id))\"\
        \ \\\n  \"<< \\\", \\\\\\\"target\\\\\\\": \\\" << json::quote(std::to_string(l.id))\"\nmake clean\nif make test;\
        \ then echo \"::error::not caught\"; exit 1; fi\ngit checkout -- src/io/ofxManifoldSerialize.h\n"
    - name: Restored tree must be green
      run: 'make clean

        make test

        '
